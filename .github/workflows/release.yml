name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed vX.Y.Z tag to validate (unsigned dry run only)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.context.outputs.commit }}
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.tooling/gradle-home
    steps:
      # Validate the tag using reviewed tooling from main before checking out its source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: true
      - name: Validate reviewed tag and increasing versionCode
        id: context
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python3 scripts/release.py preflight --tag "$RELEASE_TAG"
      - name: Checkout reviewed release commit
        env:
          RELEASE_COMMIT: ${{ steps.context.outputs.commit }}
        run: git checkout --detach "$RELEASE_COMMIT"
      - name: Install declared Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate repository and workflows
        run: |
          python3 scripts/check-repository.py
          bash scripts/check-workflows.sh
      - name: Build unsigned release and run tests without secrets
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        run: python3 scripts/release.py unsigned --tag "$RELEASE_TAG" --output-dir build/unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: build/unsigned/
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: build
    # Unset by default. Manual workflow_dispatch runs NEVER sign or publish.
    if: github.event_name == 'push' && vars.ENABLE_RELEASE_PUBLISHING == 'true'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
      apk_name: ${{ steps.sign.outputs.apk_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently check reviewed commit
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verification tools before loading secrets
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: build/unsigned
      - name: Verify unsigned artifact before loading secrets
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: python3 scripts/release.py verify-unsigned --tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT" --input-dir build/unsigned
      - name: Load environment-scoped signing files
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/ci-signing.py prepare
      - name: Sign and verify APK without running Gradle
        id: sign
        env:
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: python3 scripts/release.py sign --config "$SIGNING_CONFIG" --unsigned build/unsigned/app-release-unsigned.apk --output-dir build/releases
      - name: Remove temporary signing files
        if: always()
        run: python3 scripts/ci-signing.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: |
            build/releases/SELFonium-v*.apk
            build/releases/SELFonium-v*.apk.sha256
            build/releases/SELFonium-v*.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [build, sign]
    if: github.event_name == 'push' && vars.ENABLE_RELEASE_PUBLISHING == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: build/releases
      - name: Generate release notes
        run: python3 scripts/release.py notes --output-dir build/releases
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          APK_NAME: ${{ needs.sign.outputs.apk_name }}
          EXPECTED_SHA256: ${{ needs.sign.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          apk=Path('build/releases')/os.environ['APK_NAME']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256']
          PY
          apk="build/releases/$APK_NAME"
          manifest="${apk%.apk}.json"
          gh release create "$RELEASE_TAG" "$apk" "$apk.sha256" "$manifest" --verify-tag --draft --title "SELFonium $RELEASE_VERSION" --notes-file build/releases/release-notes.md
          gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir build/upload-verification
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          apk=Path('build/upload-verification')/os.environ['APK_NAME']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256']
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
